name: Milestone Release

on:
  workflow_dispatch:
    inputs:
      increment_type:
       description: 'Version increment type'
       required: true
       default: 'patch'
       type: choice
       options:
         - patch
         - minor
         - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
         ref: main

      - name: Get current version and auto-increment
       id: version
       run: |
         CURRENT_VERSION=$(python3 << 'PYTHON_EOF'
         import json
         with open('public/version.json') as f:
             data = json.load(f)
             version = data['version'].lstrip('v')
         print(version, end='')
         PYTHON_EOF
         )
          
         echo "Current version: [$CURRENT_VERSION]"
          
         MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
         MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
         PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          
         INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"
          
         if [ "$INCREMENT_TYPE" = "major" ]; then
           MAJOR=$((MAJOR + 1))
           MINOR=0
           PATCH=0
         elif [ "$INCREMENT_TYPE" = "minor" ]; then
           MINOR=$((MINOR + 1))
           PATCH=0
         else
           PATCH=$((PATCH + 1))
         fi
          
         NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
         echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
         echo "New version: ${NEW_VERSION}"

      - name: Update version.json
       run: |
         RELEASE_DATE=$(date -u +'%Y-%m-%d')
         cat > public/version.json << EOF
         {
           "version": "v${{ steps.version.outputs.version }}",
           "releaseDate": "${RELEASE_DATE}",
           "releaseBranch": "release/v${{ steps.version.outputs.version }}"
         }
         EOF

      - name: Commit version to main
       run: |
         git config user.name "GitHub Actions"
         git config user.email "actions@github.com"
         git add public/version.json
         git commit -m "chore: release v${{ steps.version.outputs.version }}"
         git push origin main

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Building v${{ needs.prepare.outputs.version }}
        run: echo "Building version v${{ needs.prepare.outputs.version }}"
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: 🚀 Deploying v${{ needs.prepare.outputs.version }}
       run: echo "Deploying version v${{ needs.prepare.outputs.version }}"

      - name: Deploy to GitHub Pages
       id: deployment
       uses: actions/deploy-pages@v4
      
      - name: ✅ Deployment Complete
       run: |
         echo "✅ Successfully deployed v${{ needs.prepare.outputs.version }}"
         echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"

  release-branch:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Creating Release v${{ needs.prepare.outputs.version }}
       run: echo "Creating release branch and tag for v${{ needs.prepare.outputs.version }}"

      - name: Checkout main
       uses: actions/checkout@v4
       with:
         ref: main
         fetch-depth: 0

      - name: Create and push release branch
       run: |
         git config user.name "GitHub Actions"
         git config user.email "actions@github.com"
          
         RELEASE_BRANCH="release/v${{ needs.prepare.outputs.version }}"
         git checkout -b $RELEASE_BRANCH
         git push origin $RELEASE_BRANCH
          
         git tag "v${{ needs.prepare.outputs.version }}"
         git push origin "v${{ needs.prepare.outputs.version }}"
          
         echo "✅ Release branch created: $RELEASE_BRANCH"
         echo "✅ Tag created: v${{ needs.prepare.outputs.version }}"
      
      - name: 📋 Generate Release Summary
       run: |
         cat >> $GITHUB_STEP_SUMMARY << 'EOF'
         # 🎉 Release Summary
          
         | Item | Details |
         |------|---------|
         | **Version** | v${{ needs.prepare.outputs.version }} |
         | **Release Date** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |
         | **Release Branch** | `release/v${{ needs.prepare.outputs.version }}` |
         | **Git Tag** | `v${{ needs.prepare.outputs.version }}` |
         | **Deployment URL** | [View Live](https://sysout-in.github.io/) |
         | **Status** | ✅ Successfully Released |
         EOF
