name: Manual Release & Deploy

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_branch: ${{ steps.version.outputs.release_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version and auto-increment
        id: version
        run: |
          # Read current version from version.json
          CURRENT_VERSION=$(grep '"version"' public/version.json | head -1 | sed 's/.*"v\?"\?\([^"]*\)".*/\1/')
          
          # Parse version parts
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          
          # Increment based on input
          INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"
          
          if [ "$INCREMENT_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          RELEASE_BRANCH="release/v${NEW_VERSION}"
          
          echo "Current version: v${CURRENT_VERSION}"
          echo "Increment type: ${INCREMENT_TYPE}"
          echo "New version: v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "release_branch=${RELEASE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          RELEASE_BRANCH="${{ steps.version.outputs.release_branch }}"
          git checkout -b ${RELEASE_BRANCH}
          git push origin ${RELEASE_BRANCH}

      - name: Update version in public/version.json
        run: |
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          cat > public/version.json << EOF
          {
            "version": "v${{ steps.version.outputs.version }}",
            "releaseDate": "${RELEASE_DATE}",
            "releaseBranch": "${{ steps.version.outputs.release_branch }}"
          }
          EOF

      - name: Commit version update
        run: |
          git add public/version.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin "${{ steps.version.outputs.release_branch }}" || echo "Push failed, branch may already exist"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          release_name: Release v${{ needs.prepare.outputs.version }}
          body: |
            ## Release v${{ needs.prepare.outputs.version }}
            
            Release Branch: ${{ needs.prepare.outputs.release_branch }}
            
            This release has been automatically deployed to GitHub Pages.
            
            **Deployment URL:** ${{ steps.deployment.outputs.page_url }}
          draft: false
          prerelease: false
