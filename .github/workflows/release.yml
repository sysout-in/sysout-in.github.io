name: Manual Release & Deploy

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Get current version and auto-increment
        id: version
        run: |
          # Read current version from version.json and extract version number (remove 'v' prefix)
          CURRENT_VERSION=$(cat public/version.json | grep -o '"version": "[^"]*"' | cut -d'"' -f4 | sed 's/^v//')
           
          echo "Current version: $CURRENT_VERSION"
           
          # Parse version parts
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
           
          # Increment based on input
          INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"
           
          if [ "$INCREMENT_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
           
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
           
          echo "Increment type: ${INCREMENT_TYPE}"
          echo "New version: ${NEW_VERSION}"
           
          # Set output variable
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Update version in public/version.json
        run: |
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          cat > public/version.json << EOF
          {
            "version": "v${{ steps.version.outputs.version }}",
            "releaseDate": "${RELEASE_DATE}",
            "releaseBranch": "main"
          }
          EOF

      - name: Commit and push version update to main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/version.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin main

  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout main (with fresh code after prepare job)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate version before release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "DEBUG: Version to be released: '$VERSION'"
          
          if [ -z "$VERSION" ]; then
            echo "ERROR: Version is empty!"
            exit 1
          fi
          
          # Validate version format (should be like X.Y.Z)
          if ! echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format: $VERSION"
            exit 1
          fi
          
          echo "✓ Version validated: v$VERSION"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          release_name: Release v${{ needs.prepare.outputs.version }}
          body: |
            ## Release v${{ needs.prepare.outputs.version }}
            
            This release has been automatically deployed to GitHub Pages.
            
            **Deployment URL:** ${{ steps.deployment.outputs.page_url }}
          draft: false
          prerelease: false
