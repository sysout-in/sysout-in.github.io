name: Manual Release - Update Version & Create Branch

on:
  workflow_dispatch:
    inputs:
      increment_type:
       description: 'Version increment type'
       required: true
       default: 'patch'
       type: choice
       options:
         - patch
         - minor
         - major

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
         ref: main

      - name: Get current version and auto-increment
       id: version
       run: |
         # Use Python for reliable JSON parsing
         CURRENT_VERSION=$(python3 << 'PYTHON_EOF'
         import json
         with open('public/version.json') as f:
             data = json.load(f)
             version = data['version'].lstrip('v')
         print(version, end='')
         PYTHON_EOF
         )
          
         echo "Current version: [$CURRENT_VERSION]"
          
         # Parse version parts
         MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
         MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
         PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          
         echo "Parts: MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH"
          
         # Increment based on input
         INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"
         echo "DEBUG: INCREMENT_TYPE=$INCREMENT_TYPE"
          
         if [ "$INCREMENT_TYPE" = "major" ]; then
           MAJOR=$((MAJOR + 1))
           MINOR=0
           PATCH=0
         elif [ "$INCREMENT_TYPE" = "minor" ]; then
           MINOR=$((MINOR + 1))
           PATCH=0
         else
           PATCH=$((PATCH + 1))
         fi
          
         NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          
         echo "Increment type: ${INCREMENT_TYPE}"
         echo "New version: ${NEW_VERSION}"
          
         # Set output variable
         echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Update version in public/version.json
       run: |
         RELEASE_DATE=$(date -u +'%Y-%m-%d')
         cat > public/version.json << EOF
         {
           "version": "v${{ steps.version.outputs.version }}",
           "releaseDate": "${RELEASE_DATE}",
           "releaseBranch": "release/v${{ steps.version.outputs.version }}"
         }
         EOF

      - name: Create and push release branch
       run: |
         git config user.name "GitHub Actions"
         git config user.email "actions@github.com"
          
         # Create release branch
         RELEASE_BRANCH="release/v${{ steps.version.outputs.version }}"
         git checkout -b $RELEASE_BRANCH
          
         # Commit version update
         git add public/version.json
         git commit -m "chore: release v${{ steps.version.outputs.version }}"
          
         # Push both the branch and the tag
         git push origin $RELEASE_BRANCH
         git tag "v${{ steps.version.outputs.version }}"
         git push origin "v${{ steps.version.outputs.version }}"
          
         # Also update main with the version
         git checkout main
         git pull origin main
         git merge $RELEASE_BRANCH
         git push origin main
