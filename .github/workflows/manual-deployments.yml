name: Manual Deployments

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: |
          Version increment type
          (auto-tags minor/major)
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      create_release_branch:
        description: "Create Release branch"
        required: true
        default: false
        type: boolean
      release_note:
        description: "Release note"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "manual-deployments"
  cancel-in-progress: false

jobs:
  ensure-main:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow can only run from main."
            exit 1
          fi

  prepare:
    needs: ensure-main
    if: ${{ github.event.inputs.increment_type != 'none' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Get current version and increment
        id: version
        run: |
          CURRENT_VERSION=$(python3 << 'PYTHON_EOF'
          import json
          with open('public/version.json') as f:
              data = json.load(f)
          print(data['version'].lstrip('v'), end='')
          PYTHON_EOF
          )

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"

          if [ "$INCREMENT_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update version in public/version.json
        run: |
          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          cat > public/version.json << EOF
          {
            "version": "v${{ steps.version.outputs.version }}",
            "releaseDate": "${RELEASE_DATE}",
            "releaseBranch": "main"
          }
          EOF

      - name: Update release history in README
        env:
          RELEASE_NOTE: ${{ github.event.inputs.release_note }}
          RELEASE_TYPE: ${{ github.event.inputs.increment_type }}
          RELEASE_VERSION: v${{ steps.version.outputs.version }}
          CREATE_RELEASE_BRANCH: ${{ github.event.inputs.create_release_branch }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_DATETIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          export RELEASE_DATETIME
          python3 << 'PYTHON_EOF'
          import os
          import re
          from pathlib import Path

          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")

          table_header = "| version | type | Date-Time | Note | release branch |"
          table_divider = "| --- | --- | --- | --- | --- |"
          legacy_table_header = "| version | type | Date-Time | Note |"
          legacy_table_divider = "| --- | --- | --- | --- |"

          release_note = os.environ.get("RELEASE_NOTE", "").strip()
          if not release_note:
              release_note = "(no note provided)"

          release_note = release_note.replace("\r\n", "\n").replace("\r", "\n")
          release_note = "<br>".join(line.strip() for line in release_note.split("\n"))
          release_note = release_note.replace("|", "\\|")

          release_branch = "-"
          if (
              os.environ.get("RELEASE_TYPE") != "none"
              and os.environ.get("CREATE_RELEASE_BRANCH") == "true"
          ):
              branch_name = f"release/{os.environ['RELEASE_VERSION']}"
              branch_url = (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/tree/{branch_name}"
              )
              release_branch = f"[{branch_name}]({branch_url})"

          row = (
              f"| {os.environ['RELEASE_VERSION']} | {os.environ['RELEASE_TYPE']} | "
              f"{os.environ['RELEASE_DATETIME']} | {release_note} | {release_branch} |"
          )

          def parse_cells(table_row: str) -> list[str]:
              inner = table_row.strip()[1:-1]
              return [cell.strip() for cell in re.split(r"(?<!\\)\|", inner)]

          def format_cells(cells: list[str]) -> str:
              return "| " + " | ".join(cells) + " |"

          if table_header in content:
              lines = content.splitlines()
              header_index = lines.index(table_header)
          elif legacy_table_header in content:
              lines = content.splitlines()
              header_index = lines.index(legacy_table_header)
              lines[header_index] = table_header
          else:
              lines = None

          if lines is not None:
              divider_index = header_index + 1
              if divider_index >= len(lines):
                  lines.append(table_divider)
              elif lines[divider_index].strip() in {table_divider, legacy_table_divider}:
                  lines[divider_index] = table_divider
              else:
                  lines.insert(divider_index, table_divider)

              row_index = divider_index + 1
              while row_index < len(lines):
                  stripped = lines[row_index].strip()
                  if not stripped.startswith("|"):
                      break
                  if stripped == table_divider:
                      row_index += 1
                      continue
                  cells = parse_cells(stripped)
                  if len(cells) == 4:
                      lines[row_index] = format_cells(cells + ["-"])
                  row_index += 1

              lines.insert(divider_index + 1, row)
              updated = "\n".join(lines).rstrip() + "\n"
          else:
              release_history_block = (
                  "\n## Release History\n\n"
                  f"{table_header}\n"
                  f"{table_divider}\n"
                  f"{row}\n"
              )
              updated = content.rstrip() + "\n" + release_history_block

          readme_path.write_text(updated, encoding="utf-8")
          PYTHON_EOF

      - name: Commit and push version update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/version.json README.md
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Create and push Git tag
        if: ${{ github.event.inputs.increment_type == 'minor' || github.event.inputs.increment_type == 'major' }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "${TAG}"
          git push origin "${TAG}"

  build:
    needs: [ensure-main, prepare]
    if: ${{ always() && needs.ensure-main.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    with:
      build_ref: main

  deploy:
    needs: [prepare, build]
    if: ${{ always() && needs.build.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout main for release branch
        if: ${{ github.event.inputs.increment_type != 'none' && github.event.inputs.create_release_branch == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create release branch
        if: ${{ github.event.inputs.increment_type != 'none' && github.event.inputs.create_release_branch == 'true' }}
        run: |
          BRANCH="release/v${{ needs.prepare.outputs.version }}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on origin; skipping creation."
            exit 0
          fi
          git checkout -b "${BRANCH}"
          git push origin "${BRANCH}"

      - name: Create GitHub Release
        if: ${{ github.event.inputs.increment_type == 'major' }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          body: |
            ## Release v${{ needs.prepare.outputs.version }}

            This release has been manually deployed to GitHub Pages.

            **Deployment URL:** ${{ steps.deployment.outputs.page_url }}
          draft: false
          prerelease: false
